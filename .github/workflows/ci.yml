name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: dds, POSTGRES_PASSWORD: dds, POSTGRES_DB: dds_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dds" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Tests (PostgreSQL + pgvector)
        working-directory: backend
        env: {TEST_DATABASE_URL: "postgresql+asyncpg://dds:dds@localhost:5432/dds_test"}
        run: pytest -q
      - name: Migrations apply cleanly
        working-directory: backend
        env: {DATABASE_URL: "postgresql+asyncpg://dds:dds@localhost:5432/dds_test"}
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
